[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt-hub"
version = "0.1.0"
description = "Job Application & AI Tailoring Hub with Typst PDF compiler and Ollama AI assistant"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "cryptography>=42.0",
    "httpx>=0.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

# Only jobhunt is an importable package; the sibling dirs (Base, config,
# dashboard) are data/source accessed via ROOT-relative paths at runtime, not
# installed. Declaring this disables flat-layout auto-discovery.
[tool.setuptools]
packages = ["jobhunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

