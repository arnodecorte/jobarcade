<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draft Pack Builder</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="draft-page">
    <div class="draft-shell">
      <header class="draft-topbar">
        <div>
          <p class="draft-kicker">Angelica Job Hunt HQ</p>
          <h1>Draft Pack Builder</h1>
          <p id="draft-subtitle">Load a job, create a local draft, then review and build it.</p>
        </div>
        <div class="topbar-actions">
          <a class="button secondary" href="/">Back to Dashboard</a>
          <button id="draft-refresh-button" type="button">Refresh</button>
        </div>
      </header>

      <main class="draft-main">
        <section class="draft-canvas">
          <div class="draft-stage-header">
            <div id="draft-job-summary" class="draft-job-summary"></div>
            <div id="draft-stage-actions" class="draft-stage-actions"></div>
          </div>
          <div id="draft-page-message" class="draft-page-message" hidden></div>
          <div id="draft-page-content"></div>
        </section>
      </main>
    </div>
    <script src="/draft.js"></script>
  </body>
</html>
